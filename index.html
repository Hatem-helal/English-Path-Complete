rns clearly.`,translation:`عبّرت عن مخاوفها بوضوح.`,category:`تعبير`},{id:`c1-ambiguity`,level:`C1`,word:`ambiguity`,phonetic:`/ˌæmbɪˈɡjuːəti/`,meaning:`غموض / التباس`,example:`The wording creates unnecessary ambiguity.`,translation:`تسبب الصياغة غموضًا غير ضروري.`,category:`دراسة`},{id:`c1-unprecedented`,level:`C1`,word:`unprecedented`,phonetic:`/ʌnˈpresɪdentɪd/`,meaning:`غير مسبوق`,example:`Demand reached an unprecedented level.`,translation:`وصل الطلب إلى مستوى غير مسبوق.`,category:`دراسة`},{id:`c1-coherent`,level:`C1`,word:`coherent`,phonetic:`/kəʊˈhɪərənt/`,meaning:`مترابط / متماسك`,example:`The report presents a coherent strategy.`,translation:`يقدم التقرير استراتيجية مترابطة.`,category:`عمل`},{id:`c1-detrimental`,level:`C1`,word:`detrimental`,phonetic:`/ˌdetrɪˈmentl/`,meaning:`ضار`,example:`Poor sleep is detrimental to concentration.`,translation:`قلة النوم ضارة بالتركيز.`,category:`دراسة`},{id:`c1-nuance`,level:`C1`,word:`nuance`,phonetic:`/ˈnjuːɑːns/`,meaning:`فرق دقيق / دلالة خفية`,example:`Translation can miss cultural nuances.`,translation:`قد تفوّت الترجمة الدلالات الثقافية الدقيقة.`,category:`تعبير`},{id:`c1-scrutinise`,level:`C1`,word:`scrutinise`,phonetic:`/ˈskruːtənaɪz/`,meaning:`يفحص بدقة`,example:`The committee scrutinised the evidence.`,translation:`فحصت اللجنة الأدلة بدقة.`,category:`عمل`},{id:`c1-viable`,level:`C1`,word:`viable`,phonetic:`/ˈvaɪəbl/`,meaning:`قابل للتطبيق`,example:`We need a financially viable solution.`,translation:`نحتاج إلى حل قابل للتطبيق ماليًا.`,category:`عمل`},{id:`c1-inevitable`,level:`C1`,word:`inevitable`,phonetic:`/ɪnˈevɪtəbl/`,meaning:`حتمي`,example:`Some degree of change is inevitable.`,translation:`قدر من التغيير أمر حتمي.`,category:`تعبير`},{id:`c1-mitigate`,level:`C1`,word:`mitigate`,phonetic:`/ˈmɪtɪɡeɪt/`,meaning:`يخفف / يحد من`,example:`These measures may mitigate the impact.`,translation:`قد تخفف هذه التدابير من الأثر.`,category:`عمل`}],f=[{id:`p-a1-1`,level:`A1`,phrase:`How are you today?`,meaning:`كيف حالك ا + may / might / appears to + verb`,example:`The results may indicate a gradual change.`,translation:`قد تشير النتائج إلى تغير تدريجي.`}],m=[{id:`present-simple`,group:`الحاضر`,english:`Present Simple`,arabic:`المضارع البسيط`,use:`للعادات، الحقائق، والجداول الثابتة.`,formula:`Subject + base verb (+s)`,example:`The train leaves at 8:00.`,translation:`يغادر القطار الساعة الثامنة.`,signalWords:[`always`,`usually`,`every day`]},{id:`present-continuous`,group:`الحاضر`,english:`Present Continuous`,arabic:`المضارع المستمر`,use:`لشيء يحدث الآن أو ترتيب مستقبلي مؤكد.`,formula:`Subject + am/is/are + verb-ing`,example:`I am studying now.`,translation:`أنا أدرس الآن.`,signalWords:[`now`,`at the moment`,`currently`]},{id:`present-perfect`,group:`الحاضر`,english:`Present Perfect`,arabic:`المضارع التام`,use:`لتجربة أو حدث ماضٍ له نتيجة في الحاضر.`,formula:`Subject + have/has + V3`,example:`She has finished her assignment.`,translation:`لقد أنهت واجبها.`,signalWords:[`already`,`yet`,`ever`,`since`]},{id:`present-perfect-continuous`,group:`الحاضر`,english:`Present Perfect Continuous`,arabic:`المضارع التام المستمر`,use:`لنشاط بدأ في الماضي وما زال مستمرًا مع التركيز على المدة.`,formula:`Subject + have/has been + verb-ing`,example:`We have been waiting for an hour.`,translation:`نحن ننتظر منذ ساعة.`,signalWords:[`for`,`since`,`all day`]},{id:`past-simple`,group:`الماضي`,english:`Past Simple`,arabic:`الماضي البسيط`,use:`لحدث مكتمل في وقت ماضٍ معروف.`,formula:`Subject + V2`,example:`I called the agent yesterday.`,translation:`اتصلت بالوكيل أمس.`,signalWords:[`yesterday`,`last week`,`ago`]},{id:`past-continuous`,group:`الماضي`,english:`Past Continuous`,arabic:`الماضي المستمر`,use:`لنشاط كان مستمرًا في لحظة ماضية أو قطعه حدث آخر.`,formula:`Subject + was/were + verb-ing`,example:`I was driving when you called.`,translation:`كنت أقود عندما اتصلت.`,signalWords:[`while`,`when`,`at 6 pm`]},{id:`past-perfect`,group:`الماضي`,english:`Past Perfect`,arabic:`الماضي التام`,use:`للحدث الذي وقع قبل حدث آخر في الماضي.`,formula:`Subject + had + V3`,example:`The bus had left before we arrived.`,translation:`كانت الحافلة قد غادرت قبل وصولنا.`,signalWords:[`before`,`after`,`by the time`]},{id:`past-perfect-continuous`,group:`الماضي`,english:`Past Perfect Continuous`,arabic:`الماضي التام المستمر`,use:`لنشاط استمر مدة قبل نقطة ماضية أخرى.`,formula:`Subject + had been + verb-ing`,example:`He had been working for hours before he rested.`,translation:`كان يعمل لساعات قبل أن يستريح.`,signalWords:[`for`,`since`,`before`]},{id:`future-simple`,group:`المستقبل`,english:`Future Simple`,arabic:`المستقبل البسيط`,use:`لقرار لحظي، وعد، أو توقع.`,formula:`Subject + will + base verb`,example:`I will send the email tonight.`,translation:`سأرسل البريد الليلة.`,signalWords:[`tomorrow`,`probably`,`I think`]},{id:`future-continuous`,group:`المستقبل`,english:`Future Continuous`,arabic:`المستقبل المستمر`,use:`لنشاط سيكون جاريًا في وقت مستقبلي محدد.`,formula:`Subject + will be + verb-ing`,example:`This time tomorrow, I will be flying.`,translation:`في مثل هذا الوقت غدًا سأكون مسافرًا بالطائرة.`,signalWords:[`this time tomorrow`,`at 9 pm`]},{id:`future-perfect`,group:`المستقبل`,english:`Future Perfect`,arabic:`المستقبل التام`,use:`لحدث سيكتمل قبل وقت مستقبلي معين.`,formula:`Subject + will have + V3`,example:`By Friday, we will have completed the report.`,translation:`بحلول الجمعة سنكون قد أكملنا التقرير.`,signalWords:[`by`,`before`,`by the time`]},{id:`future-perfect-continuous`,group:`المستقبل`,english:`Future Perfect Continuous`,arabic:`المستقبل التام المستمر`,use:`للتأكيد على مدة نشاط مستمر حتى نقطة مستقبلية.`,formula:`Subject + will have been + verb-ing`,example:`By June, she will have been studying here for a year.`,translation:`بحلول يونيو ستكون قد أمضت عامًا في الدراسة هنا.`,signalWords:[`for`,`by`,`by the time`]}],h=[{id:`a1-new-morning`,level:`A1`,title:`A New Morning`,arabicTitle:`صباح جديد`,theme:`الحياة اليومية`,duration:`دقيقة واحدة`,summary:`قصة بسيطة عن روتين إيما الصباحي وطريقها إلى المدرسة.`,paragraphs:[`Emma wakes up at seven o’clock every morning. She opens the window and drinks a glass of water.`,`She eats bread and cheese for breakfast. At eight o’clock, she takes the bus to school. The blue bus usually arrives early.`,`At school, Emma meets her friend Lina. They smile, say hello, and walk to class together. Emma likes mornings because every day feels like a new start.`],vocabulary:[{id:`a1-morning-wake-up`,word:`wake up`,phonetic:`/weɪk ʌp/`,meaning:`يستيقظ`,example:`Emma wakes up at seven o’clock.`},{id:`a1-morning-breakfast`,word:`breakfast`,phonetic:`/ˈbrekfəst/`,meaning:`وجبة الإفطار`,example:`She eats bread for breakfast.`},{id:`a1-morning-bus`,word:`bus`,phonetic:`/bʌs/`,meaning:`حافلة`,example:`She takes the bus to school.`},{id:`a1-morning-early`,word:`early`,phonetic:`/ˈɜːli/`,meaning:`مبكرًا`,example:`The bus arrives early.`},{id:`a1-morning-together`,word:`together`,phonetic:`/təˈɡeðə/`,meaning:`معًا`,example:`They walk to class together.`}],questions:[{id:`a1-morning-q1`,prompt:`What time does Emma wake up?`,options:[`At six`,`At seven`,`At eight`,`At nine`],answer:`At seven`},{id:`a1-morning-q2`,prompt:`What does Emma eat for breakfast?`,options:[`Rice and meat`,`Bread and cheese`,`Fruit and cake`,`Eggs and soup`],answer:`Bread and cheese`},{id:`a1-morning-q3`,prompt:`How does Emma go to school?`,options:[`By bus`,`By car`,`By train`,`On foot`],answer:`By bus`},{id:`a1-morning-q4`,prompt:`Who does Emma meet at school?`,options:[`Her teacher`,`Her brother`,`Her friend Lina`,`Her mother`],answer:`Her friend Lina`}]},{id:`a1-red-umbrella`,level:`A1`,title:`The Red Umbrella`,arabicTitle:`المظلة الحمراء`,theme:`موقف يومي`,duration:`دقيقة واحدة`,summary:`يعثر سام على مظلة في المقهى ويبحث عن صاحبتها.`,paragraphs:[`It is a rainy afternoon. Sam sits in a small café and drinks hot tea. A red umbrella is under the next table.`,`Sam asks the people in the café, but the umbrella is not theirs. He waits near the door with the umbrella.`,`A woman comes back and looks worried. The red umbrella is hers. Sam gives it to her, and she says, ‘Thank you!’ They both smile.`],vocabulary:[{id:`a1-umbrella-rainy`,word:`rainy`,phonetic:`/ˈreɪni/`,meaning:`ممطر`,example:`It is a rainy afternoon.`},{id:`a1-umbrella-umbrella`,word:`umbrella`,phonetic:`/ʌmˈbrelə/`,meaning:`مظلة`,example:`A red umbrella is under the table.`},{id:`a1-umbrella-under`,word:`under`,phonetic:`/ˈʌndə/`,meaning:`تحت`,example:`It is under the next table.`},{id:`a1-umbrella-worried`,word:`worried`,phonetic:`/ˈwʌrid/`,meaning:`قلق`,example:`The woman looks worried.`},{id:`a1-umbrella-give`,word:`give`,phonetic:`/ɡɪv/`,meaning:`يعطي`,example:`Sam gives the umbrella to her.`}],questions:[{id:`a1-umbrella-q1`,prompt:`What is the weather like?`,options:[`Sunny`,`Windy`,`Rainy`,`Snowy`],answer:`Rainy`},{id:`a1-umbrella-q2`,prompt:`Where is the umbrella?`,options:[`Under a table`,`On a bus`,`In a bag`,`Near a tree`],answer:`Under a table`},{id:`a1-umbrella-q3`,prompt:`What colour is the umbrella?`,options:[`Blue`,`Black`,`Yellow`,`Red`],answer:`Red`},{id:`a1-umbrella-q4`,prompt:`Who owns the umbrella?`,options:[`Sam`,`A woman`,`The waiter`,`A child`],answer:`A woman`}]},{id:`a2-lost-wallet`,level:`A2`,title:`The Lost Wallet`,arabicTitle:`المحفظة المفقودة`,theme:`الأمانة والمساعدة`,duration:`دقيقتان`,summary:`تجد لينا محفظة في الترام وتقرر إعادتها إلى صاحبها.`,paragraphs:[`Lina was travelling home on the tram after work. When she stood up, she noticed a brown wallet under her seat. There was some money, a bank card, and a student card inside it.`,`Lina did not want to leave the wallet on the tram. She took it to the police station near her home and explained where she had found it. An officer used the name on the student card to contact the owner.`,`An hour later, a university student called Marcus arrived. He was very relieved and grateful. He thanked Lina and offered her some money, but she politely refused. Helping him was enough for her.`],vocabulary:[{id:`a2-wallet-notice`,word:`notice`,phonetic:`/ˈnəʊtɪs/`,meaning:`يلاحظ`,example:`She noticed a wallet under her seat.`},{id:`a2-wallet-wallet`,word:`wallet`,phonetic:`/ˈwɒlɪt/`,meaning:`محفظة`,example:`The brown wallet was on the tram.`},{id:`a2-wallet-inside`,word:`inside`,phonetic:`/ɪnˈsaɪd/`,meaning:`في الداخل`,example:`A student card was inside it.`},{id:`a2-wallet-relieved`,word:`relieved`,phonetic:`/rɪˈliːvd/`,meaning:`شعر بالارتياح`,example:`Marcus was relieved to see his wallet.`},{id:`a2-wallet-refuse`,word:`refuse`,phonetic:`/rɪˈfjuːz/`,meaning:`يرفض`,example:`Lina politely refused the money.`}],questions:[{id:`a2-wallet-q1`,prompt:`Where did Lina find the wallet?`,options:[`On a tram`,`In a café`,`At work`,`In a shop`],answer:`On a tram`},{id:`a2-wallet-q2`,prompt:`What helped the officer find the owner?`,options:[`A phone`,`A student card`,`A receipt`,`A key`],answer:`A student card`},{id:`a2-wallet-q3`,prompt:`How did Marcus feel?`,options:[`Angry`,`Bored`,`Relieved`,`Confused`],answer:`Relieved`},{id:`a2-wallet-q4`,prompt:`Did Lina accept money from Marcus?`,options:[`Yes, all of it`,`Yes, a little`,`No, she refused`,`The story does not say`],answer:`No, she refused`}]},{id:`a2-busy-saturday`,level:`A2`,title:`A Busy Saturday`,arabicTitle:`يوم سبت مزدحم`,theme:`التخطيط لليوم`,duration:`دقيقتان`,summary:`يخطط عمر ليوم مزدحم لكنه يجد وقتًا لمساعدة جارته.`,paragraphs:[`Omar made a list on Friday night because he had many things to do on Saturday. First, he went to the market and bought vegetables for dinner. Then he visited the library to return two books and borrow a new one.`,`When Omar came home, his elderly neighbour asked him to carry a heavy box upstairs. He was already tired, but he agreed to help her. She thanked him and invited him to have coffee.`,`In the evening, Omar prepared vegetable soup and called his brother. He did not finish everything on his list, but he felt happy because he had used his time well and helped someone too.`],vocabulary:[{id:`a2-saturday-list`,word:`list`,phonetic:`/lɪst/`,meaning:`قائمة`,example:`Omar made a list on Friday night.`},{id:`a2-saturday-borrow`,word:`borrow`,phonetic:`/ˈbɒrəʊ/`,meaning:`يستعير`,example:`He borrowed a new book.`},{id:`a2-saturday-neighbour`,word:`neighbour`,phonetic:`/ˈneɪbə/`,meaning:`جار`,example:`His neighbour needed help.`},{id:`a2-saturday-heavy`,word:`heavy`,phonetic:`/ˈhevi/`,meaning:`ثقيل`,example:`He carried a heavy box.`},{id:`a2-saturday-prepare`,word:`prepare`,phonetic:`/prɪˈpeə/`,meaning:`يُحضّر`,example:`Omar prepared vegetable soup.`}],questions:[{id:`a2-saturday-q1`,prompt:`Why did Omar make a list?`,options:[`He had many tasks`,`He was going on holiday`,`He wanted a new job`,`He forgot his address`],answer:`He had many tasks`},{id:`a2-saturday-q2`,prompt:`What did he do at the library?`,options:[`He met his brother`,`He bought vegetables`,`He returned and borrowed books`,`He carried a box`],answer:`He returned and borrowed books`},{id:`a2-saturday-q3`,prompt:`Who asked Omar for help?`,options:[`A librarian`,`His neighbour`,`His manager`,`A driver`],answer:`His neighbour`},{id:`a2-saturday-q4`,prompt:`Why was Omar happy at the end?`,options:[`He finished every task`,`He won some money`,`He used his time well and helped`,`He stayed in bed`],answer:`He used his time well and helped`}]},{id:`b1-interview`,level:`B1`,title:`The Interview That Almost Went Wrong`,arabicTitle:`المقابلة التي كادت أن تفشل`,theme:`العمل والثقة`,duration:`3 دقائق`,summary:`يتعامل آدم مع تأخر القطار قبل مقابلة عمل مهمة.`,paragraphs:[`Adam had applied for a part-time job at a busy city café. Although he had worked in a small restaurant before, he felt nervous about the interview. The night before, he prepared examples of times when he had solved problems and helped customers.`,`On the morning of the interview, Adam’s train suddenly stopped between stations. The driver announced a long delay. Instead of waiting and hoping for the best, Adam called the café manager. He explained the situation honestly, apologised, and asked whether they could start fifteen minutes later.`,`When Adam finally arrived, the manager thanked him for calling. During the interview, she asked how he handled pressure. Adam smiled and described what had just happened. His calm response became his best example, and he was offered the job the next day.`,`Adam learned that preparation is important, but good communication can be just as valuable when plans change unexpectedly.`],vocabulary:[{id:`b1-interview-apply`,word:`apply`,phonetic:`/əˈplaɪ/`,meaning:`يتقدم بطلب`,example:`Adam applied for a part-time job.`},{id:`b1-interview-nervous`,word:`nervous`,phonetic:`/ˈnɜːvəs/`,meaning:`متوتر`,example:`He felt nervous about the interview.`},{id:`b1-interview-delay`,word:`delay`,phonetic:`/dɪˈleɪ/`,meaning:`تأخير`,example:`The driver announced a long delay.`},{id:`b1-interview-pressure`,word:`pressure`,phonetic:`/ˈpreʃə/`,meaning:`ضغط`,example:`She asked how he handled pressure.`},{id:`b1-interview-valuable`,word:`valuable`,phonetic:`/ˈvæljuəbəl/`,meaning:`قيّم`,example:`Good communication can be valuable.`}],questions:[{id:`b1-interview-q1`,prompt:`How did Adam prepare for the interview?`,options:[`He memorised the menu`,`He prepared examples from past work`,`He bought new equipment`,`He spoke to customers`],answer:`He prepared examples from past work`},{id:`b1-interview-q2`,prompt:`Why was Adam late?`,options:[`He woke up late`,`He missed the café`,`His train was delayed`,`He forgot the time`],answer:`His train was delayed`},{id:`b1-interview-q3`,prompt:`What did Adam do when the problem occurred?`,options:[`He cancelled the interview`,`He called and explained honestly`,`He sent a friend`,`He said nothing`],answer:`He called and explained honestly`},{id:`b1-interview-q4`,prompt:`What helped Adam get the job?`,options:[`His calm communication`,`His expensive clothes`,`Knowing the manager`,`Arriving first`],answer:`His calm communication`}]},{id:`b1-community-garden`,level:`B1`,title:`The Community Garden`,arabicTitle:`حديقة الحي`,theme:`المجتمع والتعاون`,duration:`3 دقائق`,summary:`يحوّل سكان الحي أرضًا مهملة إلى حديقة مشتركة.`,paragraphs:[`For years, an empty piece of land beside Maya’s apartment building was full of rubbish and dry weeds. Most residents complained about it, but nobody knew who should take responsibility for cleaning it.`,`Maya suggested turning the neglected land into a community garden. At first, only four neighbours volunteered. They removed the rubbish, built simple garden beds, and planted herbs and vegetables. Other residents became interested when they saw the change and began offering tools, seeds, and time.`,`The project was not always easy. Some plants died during a very hot week, and the group disagreed about how to share the work. They created a weekly schedule and held short meetings to solve problems fairly.`,`Three months later, the neighbours celebrated their first harvest together. The garden produced more than food: it helped people who had lived near each other for years finally become a community.`],vocabulary:[{id:`b1-garden-neglected`,word:`neglected`,phonetic:`/nɪˈɡlektɪd/`,meaning:`مُهمَل`,example:`The neglected land was full of rubbish.`},{id:`b1-garden-volunteer`,word:`volunteer`,phonetic:`/ˌvɒlənˈtɪə/`,meaning:`يتطوع`,example:`Four neighbours volunteered to help.`},{id:`b1-garden-responsibility`,word:`responsibility`,phonetic:`/rɪˌspɒnsəˈbɪləti/`,meaning:`مسؤولية`,example:`Nobody took responsibility for the land.`},{id:`b1-garden-schedule`,word:`schedule`,phonetic:`/ˈʃedjuːl/`,meaning:`جدول`,example:`They created a weekly schedule.`},{id:`b1-garden-harvest`,word:`harvest`,phonetic:`/ˈhɑːvɪst/`,meaning:`حصاد`,example:`They celebrated their first harvest.`}],questions:[{id:`b1-garden-q1`,prompt:`What problem did the land have?`,options:[`It was too small`,`It was neglected and dirty`,`It belonged to Maya`,`It had too many trees`],answer:`It was neglected and dirty`},{id:`b1-garden-q2`,prompt:`What made more residents interested?`,options:[`A newspaper story`,`Free food`,`Seeing the visible change`,`A government order`],answer:`Seeing the visible change`},{id:`b1-garden-q3`,prompt:`How did the group organise the work?`,options:[`They hired a company`,`They made a weekly schedule`,`Maya did everything`,`They stopped the project`],answer:`They made a weekly schedule`},{id:`b1-garden-q4`,prompt:`What was the garden’s greatest result?`,options:[`It made people a community`,`It increased rent`,`It won a prize`,`It created paid jobs`],answer:`It made people a community`}]},{id:`b2-unexpected-detour`,level:`B2`,title:`The Unexpected Detour`,arabicTitle:`الطريق البديل غير المتوقع`,theme:`السفر والمرونة`,duration:`4 دقائق`,summary:`يحوّل ثلاثة مسافرين تعطّل رحلتهم إلى تجربة لا تُنسى.`,paragraphs:[`Nora had planned every detail of her weekend trip, including the exact train that would take her to a coastal town. Halfway there, however, a technical fault forced everyone to leave the train at a small rural station. The next service would not arrive for four hours.`,`Most passengers immediately began searching for alternative transport. Nora met an older couple, Daniel and Priya, who were travelling in the same direction. They decided to share a taxi, but the driver warned them that a flooded road required a long detour through the hills.`,`Nora was initially reluctant because the detour would ruin her schedule. Yet along the way, the driver suggested stopping at a family-run bakery in a village. The three travellers shared lunch, spoke with local residents, and walked to a viewpoint that none of them had known existed.`,`They reached the coast much later than planned, but Nora no longer felt frustrated. The disruption had reminded her that a carefully organised journey can still benefit from a spontaneous decision. Sometimes the part that was never on the itinerary becomes the most worthwhile part of the trip.`],vocabulary:[{id:`b2-detour-disruption`,word:`disruption`,phonetic:`/dɪsˈrʌpʃən/`,meaning:`اضطراب أو تعطّل`,example:`The disruption stopped the train journey.`},{id:`b2-detour-alternative`,word:`alternative`,phonetic:`/ɔːlˈtɜːnətɪv/`,meaning:`بديل`,example:`Passengers searched for alternative transport.`},{id:`b2-detour-reluctant`,word:`reluctant`,phonetic:`/rɪˈlʌktənt/`,meaning:`متردد أو غير راغب`,example:`Nora was initially reluctant.`},{id:`b2-detour-spontaneous`,word:`spontaneous`,phonetic:`/spɒnˈteɪniəs/`,meaning:`عفوي`,example:`They made a spontaneous decision.`},{id:`b2-detour-worthwhile`,word:`worthwhile`,phonetic:`/ˌwɜːθˈwaɪl/`,meaning:`جدير بالوقت والجهد`,example:`The detour became worthwhile.`}],questions:[{id:`b2-detour-q1`,prompt:`Why did the passengers leave the train?`,options:[`The station was closed`,`A technical fault occurred`,`They chose to walk`,`The tickets were invalid`],answer:`A technical fault occurred`},{id:`b2-detour-q2`,prompt:`Why was a detour necessary?`,options:[`A road was flooded`,`The driver was lost`,`The bakery was closed`,`Nora requested it`],answer:`A road was flooded`},{id:`b2-detour-q3`,prompt:`What changed Nora’s attitude?`,options:[`Receiving a refund`,`Experiencing the village and viewpoint`,`Catching another train`,`Changing her destination`],answer:`Experiencing the village and viewpoint`},{id:`b2-detour-q4`,prompt:`What is the main message of the story?`,options:[`Detailed plans always fail`,`Unexpected changes can create valuable experiences`,`Taxis are better than trains`,`Travelling alone is dangerous`],answer:`Unexpected changes can create valuable experiences`}]},{id:`b2-quiet-presentation`,level:`B2`,title:`The Quiet Presentation`,arabicTitle:`العرض الهادئ`,theme:`الدراسة والتواصل`,duration:`4 دقائق`,summary:`تواجه سارة عطلًا تقنيًا أثناء عرضها وتكتشف قوة التحضير الحقيقي.`,paragraphs:[`Sara had always avoided public speaking, so delivering a ten-minute university presentation felt overwhelming. She prepared carefully, reduced each slide to one clear idea, and practised until she could explain the topic without reading from the screen.`,`Two minutes into the presentation, the projector suddenly went black. For a moment, Sara lost her train of thought. She acknowledged the problem, took a slow breath, and continued using only the notes in her hand. Instead of focusing on the missing slides, she asked the audience a question and used their responses to introduce her next point.`,`The technical problem changed the atmosphere. Her classmates became more engaged because the presentation now felt like a conversation. When the projector returned, Sara chose not to rush through the remaining slides. She selected only the evidence that supported her central argument and finished on time.`,`Her lecturer later said that the presentation was compelling not because it was perfect, but because Sara adapted calmly and kept the audience involved. The outcome gave her confidence that careful preparation creates flexibility, not just a memorised performance.`],vocabulary:[{id:`b2-presentation-overwhelming`,word:`overwhelming`,phonetic:`/ˌəʊvəˈwelmɪŋ/`,meaning:`مُربك أو يفوق القدرة`,example:`The presentation felt overwhelming.`},{id:`b2-presentation-acknowledge`,word:`acknowledge`,phonetic:`/əkˈnɒlɪdʒ/`,meaning:`يقرّ أو يعترف بوجود شيء`,example:`Sara acknowledged the technical problem.`},{id:`b2-presentation-engaged`,word:`engaged`,phonetic:`/ɪnˈɡeɪdʒd/`,meaning:`متفاعل ومهتم`,example:`Her classmates became more engaged.`},{id:`b2-presentation-compelling`,word:`compelling`,phonetic:`/kəmˈpelɪŋ/`,meaning:`مقنع وجذاب`,example:`The lecturer called it compelling.`},{id:`b2-presentation-flexibility`,word:`flexibility`,phonetic:`/ˌfleksəˈbɪləti/`,meaning:`مرونة`,example:`Preparation creates flexibility.`}],questions:[{id:`b2-presentation-q1`,prompt:`How had Sara prepared?`,options:[`She memorised every slide`,`She practised explaining without reading`,`She asked a friend to present`,`She made the slides longer`],answer:`She practised explaining without reading`},{id:`b2-presentation-q2`,prompt:`What happened during the presentation?`,options:[`The projector stopped working`,`The audience left`,`Sara forgot her notes`,`The lecturer interrupted`],answer:`The projector stopped working`},{id:`b2-presentation-q3`,prompt:`How did Sara re-engage the audience?`,options:[`She showed a video`,`She spoke more loudly`,`She asked them a question`,`She ended early`],answer:`She asked them a question`},{id:`b2-presentation-q4`,prompt:`Why was the presentation compelling?`,options:[`It had perfect slides`,`Sara adapted and involved the audience`,`It was the shortest`,`The projector returned`],answer:`Sara adapted and involved the audience`}]},{id:`c1-cost-convenience`,level:`C1`,title:`The Hidden Cost of Convenience`,arabicTitle:`التكلفة الخفية للراحة`,theme:`المجتمع والاختيارات`,duration:`5 دقائق`,summary:`تعيد طالبة النظر في العادات اليومية التي تبدو بلا تكلفة.`,paragraphs:[`For a university research project, Leila decided to examine the popularity of instant delivery services. She had assumed that the appeal was self-evident: a few taps on a screen made almost any meal or household item appear at the door. The process felt frictionless, and that apparent simplicity was precisely what interested her.`,`As Leila interviewed delivery riders, restaurant owners, and frequent customers, a more complicated picture emerged. Riders valued the flexibility but described unpredictable income and pressure to accept unsafe journeys in bad weather. Small restaurants appreciated access to new customers, yet commission fees could consume a substantial part of each sale. Customers rarely saw either problem because the application outsourced every difficult step.`,`Leila also calculated the cumulative environmental effect of single-item orders, disposable packaging, and repeated short trips. No individual order appeared especially harmful, but thousands of convenient decisions created a measurable impact. Her findings did not prove that delivery services were inherently unethical; rather, they revealed a trade-off that the design of the apps encouraged users to overlook.`,`After completing the project, Leila did not delete every delivery app. Instead, she changed how she used them. She grouped orders, avoided deliveries during dangerous weather, and collected food from nearby restaurants when possible. The study taught her that responsible consumption is not a search for perfect choices. It is the habit of noticing which costs have been made invisible and deciding when convenience genuinely justifies them.`],vocabulary:[{id:`c1-convenience-frictionless`,word:`frictionless`,phonetic:`/ˈfrɪkʃənləs/`,meaning:`سلس بلا عوائق ظاهرة`,example:`The ordering process felt frictionless.`},{id:`c1-convenience-outsource`,word:`outsource`,phonetic:`/ˈaʊtsɔːs/`,meaning:`يسند العمل إلى جهة خارجية`,example:`The app outsourced every difficult step.`},{id:`c1-convenience-cumulative`,word:`cumulative`,phonetic:`/ˈkjuːmjələtɪv/`,meaning:`تراكمي`,example:`She studied the cumulative environmental effect.`},{id:`c1-convenience-trade-off`,word:`trade-off`,phonetic:`/ˈtreɪd ɒf/`,meaning:`موازنة بين ميزتين أو تكلفتين`,example:`Convenience involved a hidden trade-off.`},{id:`c1-convenience-justify`,word:`justify`,phonetic:`/ˈdʒʌstɪfaɪ/`,meaning:`يبرر`,example:`She considered when convenience justified the cost.`}],questions:[{id:`c1-convenience-q1`,prompt:`Why did delivery apps initially seem frictionless?`,options:[`They removed visible effort from the customer`,`They employed every restaurant`,`They guaranteed low prices`,`They used no packaging`],answer:`They removed visible effort from the customer`},{id:`c1-convenience-q2`,prompt:`What tension did restaurant owners experience?`,options:[`More customers but significant commission fees`,`Fewer customers but higher profits`,`Safer work but longer hours`,`Better food but less choice`],answer:`More customers but significant commission fees`},{id:`c1-convenience-q3`,prompt:`What did Leila’s environmental analysis show?`,options:[`One order causes major damage`,`Small decisions can create a large cumulative impact`,`Packaging has no effect`,`Delivery is always unethical`],answer:`Small decisions can create a large cumulative impact`},{id:`c1-convenience-q4`,prompt:`Which statement best reflects Leila’s conclusion?`,options:[`Responsible choices require total abstinence`,`Convenience should never be used`,`Awareness can support more responsible habits`,`Apps should replace restaurants`],answer:`Awareness can support more responsible habits`}]},{id:`c1-question-memory`,level:`C1`,title:`A Question of Memory`,arabicTitle:`سؤال عن الذاكرة`,theme:`الذاكرة والتاريخ`,duration:`5 دقائق`,summary:`يكشف مشروع أرشيف شفهي أن الاختلاف بين الذكريات قد يكون معلومة مهمة.`,paragraphs:[`A local museum invited residents to record their memories of a factory that had once employed most of the town. The organisers hoped to preserve personal accounts before the remaining workers became too old to tell their stories. Daniel, a postgraduate student, was asked to help catalogue the recordings.`,`He soon noticed that witnesses often described the same event differently. One former worker remembered a strike as a moment of remarkable solidarity, while another recalled bitter disagreements among colleagues. Dates, locations, and even the weather varied from one account to the next. Daniel initially treated these discrepancies as problems that had to be corrected.`,`His supervisor challenged that assumption. Memory, she explained, is not a neutral recording retrieved unchanged from storage. People reconstruct the past through later experiences, emotions, and the stories a community repeatedly tells. Whenever possible, factual claims should be corroborated with documents and other testimony. Yet the subjective differences should also be preserved because they reveal how the event continued to shape individual lives.`,`Daniel changed the archive accordingly. He added verified historical notes without editing the speakers’ accounts into artificial agreement. Visitors could hear competing memories beside photographs, letters, and newspaper reports. The exhibition did not offer one perfectly consistent version of the factory’s history. Instead, it demonstrated that responsible historical work requires both factual scrutiny and respect for the complex ways people remember.`],vocabulary:[{id:`c1-memory-preserve`,word:`preserve`,phonetic:`/prɪˈzɜːv/`,meaning:`يحفظ من الضياع`,example:`The museum wanted to preserve personal accounts.`},{id:`c1-memory-discrepancy`,word:`discrepancy`,phonetic:`/dɪsˈkrepənsi/`,meaning:`تباين أو عدم تطابق`,example:`Daniel noticed discrepancies between accounts.`},{id:`c1-memory-reconstruct`,word:`reconstruct`,phonetic:`/ˌriːkənˈstrʌkt/`,meaning:`يعيد بناء`,example:`People reconstruct the past through experience.`},{id:`c1-memory-corroborate`,word:`corroborate`,phonetic:`/kəˈrɒbəreɪt/`,meaning:`يدعم بدليل مستقل`,example:`Documents can corroborate factual claims.`},{id:`c1-memory-scrutiny`,word:`scrutiny`,phonetic:`/ˈskruːtɪni/`,meaning:`فحص دقيق`,example:`Historical work requires factual scrutiny.`}],questions:[{id:`c1-memory-q1`,prompt:`Why did the museum collect the recordings?`,options:[`To advertise the factory`,`To preserve residents’ personal accounts`,`To settle a legal dispute`,`To reopen the factory`],answer:`To preserve residents’ personal accounts`},{id:`c1-memory-q2`,prompt:`How did Daniel first view discrepancies?`,options:[`As evidence of dishonesty`,`As problems to be corrected`,`As the exhibition’s main strength`,`As irrelevant details`],answer:`As problems to be corrected`},{id:`c1-memory-q3`,prompt:`Why should subjective differences be preserved?`,options:[`They reveal how events shaped individuals`,`They are always factually accurate`,`They replace historical documents`,`They make archives shorter`],answer:`They reveal how events shaped individuals`},{id:`c1-memory-q4`,prompt:`What approach did the final exhibition take?`,options:[`It selected one official memory`,`It removed all uncertain claims`,`It combined scrutiny with multiple personal accounts`,`It displayed recordings without context`],answer:`It combined scrutiny with multiple personal accounts`}]}],g={I:`أنا`,You:`أنت`,He:`هو`,She:`هي`,We:`نحن`,They:`هم`},_={انا:`I`,انت:`You`,هو:`He`,هي:`She`,نحن:`We`,احنا:`We`,هم:`They`},v={I:`كنت`,You:`كنت`,He:`كان`,She:`كانت`,We:`كنا`,They:`كانوا`},y={I:`سأكون`,You:`ستكون`,He:`سيكون`,She:`ستكون`,We:`سنكون`,They:`سيكونون`},b={I:`أمضيت`,You:`أمضيت`,He:`أمضى`,She:`أمضت`,We:`أمضينا`,They:`أمضوا`},x=[{key:`study`,english:`study`,masdar:`دراسة`,aliases:[`أذاكر`,`اذاكر`,`يذاكر`,`تذاكر`,`نذاكر`],present:{I:`أدرس`,You:`تدرس`,He:`يدرس`,She:`تدرس`,We:`ندرس`,They:`يدرسون`},past:{I:`درست`,You:`درست`,He:`درس`,She:`درست`,We:`درسنا`,They:`درسوا`},future:{I:`سأدرس`,You:`ستدرس`,He:`سيدرس`,She:`ستدرس`,We:`سندرس`,They:`سيدرسون`}},{key:`go`,english:`go`,masdar:`الذهاب`,aliases:[`أروح`,`اروح`,`يروح`,`تروح`,`نروح`],present:{I:`أذهب`,You:`تذهب`,He:`يذهب`,She:`تذهب`,We:`نذهب`,They:`يذهبون`},past:{I:`ذهبت`,You:`ذهبت`,He:`ذهب`,She:`ذهبت`,We:`ذهبنا`,They:`ذهبوا`},future:{I:`سأذهب`,You:`ستذهب`,He:`سيذهب`,She:`ستذهب`,We:`سنذهب`,They:`سيذهبون`}},{key:`write`,english:`write`,masdar:`كتابة`,aliases:[],present:{I:`أكتب`,You:`تكتب`,He:`يكتب`,She:`تكتب`,We:`نكتب`,They:`يكتبون`},past:{I:`كتبت`,You:`كتبت`,He:`كتب`,She:`كتبت`,We:`كتبنا`,They:`كتبوا`},future:{I:`سأكتب`,You:`ستكتب`,He:`سيكتب`,She:`ستكتب`,We:`سنكتب`,They:`سيكتبون`}},{key:`read`,english:`read`,masdar:`قراءة`,aliases:[],present:{I:`أقرأ`,You:`تقرأ`,He:`يقرأ`,She:`تقرأ`,We:`نقرأ`,They:`يقرؤون`},past:{I:`قرأت`,You:`قرأت`,He:`قرأ`,She:`قرأت`,We:`قرأنا`,They:`قرؤوا`},future:{I:`سأقرأ`,You:`ستقرأ`,He:`سيقرأ`,She:`ستقرأ`,We:`سنقرأ`,They:`سيقرؤون`}},{key:`eat`,english:`eat`,masdar:`تناول`,aliases:[],present:{I:`آكل`,You:`تأكل`,He:`يأكل`,She:`تأكل`,We:`نأكل`,They:`يأكلون`},past:{I:`أكلت`,You:`أكلت`,He:`أكل`,She:`أكلت`,We:`أكلنا`
